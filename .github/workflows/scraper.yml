name: Budapest job aggregator

on:
  schedule:
    - cron: "0 */8 * * *" # 00:00, 08:00, 16:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print Discord payloads instead of posting (state is not written)"
        type: boolean
        default: false

permissions:
  contents: read
  # Add "id-token: write" here when switching to DynamoDB (needed for AWS OIDC).

concurrency:
  group: job-aggregator
  cancel-in-progress: false

env:
  # Processed-job state (what has already been scored/alerted) is a JSON file kept between runs
  # with the Actions cache, so no AWS is needed. Cache entries unused for 7 days are evicted;
  # with a run every 8 hours that never happens. See README "State without AWS" to move to DynamoDB.
  STATE_FILE: .state/processed_jobs.json

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install headless Chromium (for crawl4ai)
        run: python -m playwright install --with-deps chromium

      - name: Unit tests
        run: pytest -q

      # Cache entries are immutable, so each run saves a new key and the next run restores
      # the most recent one through the prefix in restore-keys.
      - name: Restore processed-job state
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.STATE_FILE }}
          key: job-state-${{ github.run_id }}
          restore-keys: job-state-

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}  # empty -> DEFAULT_GROQ_MODEL in config.py
          STATE_BACKEND: local
          LOCAL_STATE_PATH: ${{ env.STATE_FILE }}
          MATCH_THRESHOLD: "65"
          MAX_JOBS_PER_RUN: "40"
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          SOURCES: careers
          CRAWL4AI_NO_CLOUD_NOTICE: "1"
        run: python -m job_aggregator.main

      # Saved even when the pipeline exits non-zero (e.g. one Discord batch failed), so jobs that
      # were already alerted are not sent again. Skipped when nothing was written (dry run, first
      # run with no new jobs).
      - name: Save processed-job state
        if: always() && hashFiles(env.STATE_FILE) != ''
        uses: actions/cache/save@v6
        with:
          path: ${{ env.STATE_FILE }}
          key: job-state-${{ github.run_id }}
